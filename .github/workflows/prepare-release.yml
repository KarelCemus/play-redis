name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 5.5.0. Empty means the next minor version."
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SBT_OPTS: "-Dfile.encoding=UTF-8 -Duser.timezone=UTC -Xmx2g"
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Cache Coursier
        uses: coursier/cache-action@v9

      - name: Setup JDK
        uses: coursier/setup-action@v3
        with:
          jvm: adoptium:1.25
          apps: sbt

      - name: Resolve version
        id: version
        run: |
          latest="$(git describe --tags --abbrev=0)"
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            IFS=. read -r major minor _ <<< "$latest"
            version="$major.$((minor + 1)).0"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "Tag $version already exists" >&2
            exit 1
          fi
          echo "Releasing $version, the latest release is $latest"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update documentation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "Karel Cemus"
          git config user.email "karel.cemus@gmail.com"
          git checkout -b "release/$VERSION"
          sbt -v "release release-version $VERSION"
          if [ "$(git rev-list --count "origin/master..HEAD")" -eq 0 ]; then
            echo "The release process created no commit" >&2
            exit 1
          fi

      - name: Open pull request
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push origin "release/$VERSION"
          gh pr create \
            --base master \
            --head "release/$VERSION" \
            --title "Documentation updated to version $VERSION" \
            --body "Prepares the release of $VERSION. Merging this pull request tags \`master\` and publishes the release. Do not change the pull request title, the tag is derived from it."
