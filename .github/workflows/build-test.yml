name: Build and Test
on:
  pull_request:

  push:
    branches:
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SBT_OPTS: "-Dfile.encoding=UTF-8 -Duser.timezone=UTC -Xmx2g"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Cache Coursier
        uses: coursier/cache-action@v6.4

      - name: Setup JDK
        uses: coursier/setup-action@v1.3.4
        with:
          jvm: adoptium:1.25

      - name: Build
        timeout-minutes: 15
        run: |
          sbt -v "+clean; +compile; +Test/compile; lint; +coverage; +test; +coverageReport;"

      - name: Coveralls (Scala 2.13)
        uses: coverallsapp/github-action@v2
        with:
          file: target/out/jvm/scala-2.13.18/play-redis/coverage-report/cobertura.xml
          format: cobertura
          flag-name: scala-2.13
          parallel: true

      - name: Coveralls (Scala 3)
        uses: coverallsapp/github-action@v2
        with:
          file: target/out/jvm/scala-3.3.9/play-redis/coverage-report/cobertura.xml
          format: cobertura
          flag-name: scala-3
          parallel: true

      - name: Coveralls (finish)
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
