name: play-redis-sentinel

services:

  redis-sentinel:
    image: "redis:8.10-alpine"
    # Everything runs in a single container on loopback with ports published 1:1. Sentinel hands out the addresses
    # of the master and replicas, and clients outside docker must be able to reach them, which is not possible
    # with container IPs on Docker Desktop (macOS, Windows).
    # Ports: master, replica, then the sentinels.
    ports:
      - "${SENTINEL_FIRST_PORT}-${SENTINEL_LAST_PORT}:${SENTINEL_FIRST_PORT}-${SENTINEL_LAST_PORT}"
    command:
      - sh
      - -c
      - |
        master=${SENTINEL_FIRST_PORT}
        replica=$$((master + 1))
        redis-server --port $$master --save "" --appendonly no --daemonize yes > /dev/null
        redis-server --port $$replica --replicaof 127.0.0.1 $$master --save "" --appendonly no --daemonize yes > /dev/null
        for port in $$(seq $$((master + 2)) ${SENTINEL_LAST_PORT}); do
          mkdir -p /data/$$port
          printf '%s\n' "port $$port" "dir /data/$$port" "sentinel monitor mymaster 127.0.0.1 $$master 2" "sentinel down-after-milliseconds mymaster 10000" > /data/$$port/sentinel.conf
          redis-server /data/$$port/sentinel.conf --sentinel --daemonize yes > /dev/null
        done
        first=$$((master + 2))
        until redis-cli -p $$first sentinel ckquorum mymaster 2> /dev/null | grep -q OK && redis-cli -p $$first sentinel replicas mymaster | grep -q ip; do sleep 0.2; done
        echo "Sentinels are ready"
        exec tail -f /dev/null
