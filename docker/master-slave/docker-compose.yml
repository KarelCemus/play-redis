name: play-redis-master-slave

services:

  redis-master:
    image: "redis:8.10-alpine"
    hostname: redis-master
    ports:
      - "${REDIS_MASTER_PORT}:6379"

  redis-slave:
    image: "redis:8.10-alpine"
    hostname: redis-slave
    command: redis-server --replicaof redis-master 6379
    ports:
      - "${REDIS_SLAVE_PORT}:6379"
    depends_on:
      - redis-master
